name: Article preview responsive QA
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths: ['src/**', 'public/**', 'ops/publication-approvals.json', 'scripts/article-preview-qa.mjs', 'scripts/all-articles-qa.mjs', '.github/workflows/article-preview-qa.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  preview:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build approved candidate
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install isolated pinned browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/article-qa" --no-package-lock --no-audit --no-fund playwright@1.64.1
          node "$RUNNER_TEMP/article-qa/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Serve local static candidate
        run: |
          python3 -m http.server 4321 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/article-preview.log" 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Inspect candidate pages at mobile and desktop widths
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/article-qa/node_modules/playwright/index.mjs
        run: node scripts/all-articles-qa.mjs
      - name: Save candidate screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-preview-qa-${{ github.run_id }}
          path: responsive-qa-evidence/
          if-no-files-found: error
          retention-days: 30
# Read-only PR QA in the runner; no server secrets or production upload.
