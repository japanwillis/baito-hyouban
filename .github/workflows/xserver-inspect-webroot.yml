+name: Inspect Xserver web root (read-only)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/xserver-inspect-webroot.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      XSERVER_HOST: ${{ vars.XSERVER_HOST }}
      XSERVER_USER: ${{ vars.XSERVER_USER }}
      XSERVER_PORT: ${{ vars.XSERVER_PORT }}
      XSERVER_KEY: ${{ secrets.XSERVER_SSH_PRIVATE_KEY }}
      EXPECTED_ED25519_FP: 'SHA256:VBukSLflrITK4l8kOHlHhvV5YrpzMEtiwOJO8uMYKY8'
    steps:
      - name: Verify connection settings and host identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$XSERVER_HOST" && test -n "$XSERVER_USER" && test -n "$XSERVER_PORT" && test -n "$XSERVER_KEY"
          [[ "$XSERVER_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$XSERVER_USER" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]]
          [[ "$XSERVER_PORT" =~ ^[0-9]{1,5}$ ]]
          umask 077
          dir="$(mktemp -d)"
          echo "SSH_TEMP_DIR=$dir" >> "$GITHUB_ENV"
          ssh-keyscan -T 10 -p "$XSERVER_PORT" -t ed25519 "$XSERVER_HOST" 2>/dev/null > "$dir/known_hosts"
          test -s "$dir/known_hosts"
          actual="$(ssh-keygen -lf "$dir/known_hosts" -E sha256 | awk '{print $2}' | head -1)"
          test "$actual" = "$EXPECTED_ED25519_FP" || { echo "::error::Host key mismatch"; exit 1; }
          printf '%s\n' "$XSERVER_KEY" > "$dir/deploy.key"
          chmod 600 "$dir/deploy.key"
          echo "Pinned SSH host key verified."
      - name: Inspect web root metadata without writing
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -rf "$SSH_TEMP_DIR"' EXIT
          ssh -T -i "$SSH_TEMP_DIR/deploy.key" -p "$XSERVER_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_TEMP_DIR/known_hosts" \
            -o ConnectTimeout=15 -o NumberOfPasswordPrompts=0 \
            "$XSERVER_USER@$XSERVER_HOST" 'sh -s' <<'REMOTE'
          set -eu
          target="$HOME/baito-hyouban.com/public_html"
          echo "WEBROOT_RELATIVE_PATH=baito-hyouban.com/public_html"
          if [ ! -d "$target" ]; then
            echo "WEBROOT_EXISTS=no"
            exit 0
          fi
          echo "WEBROOT_EXISTS=yes"
          if [ -L "$target" ]; then
            echo "WEBROOT_IS_SYMLINK=yes"
          else
            echo "WEBROOT_IS_SYMLINK=no"
          fi
          if [ -w "$target" ]; then
            echo "WEBROOT_WRITABLE=yes"
          else
            echo "WEBROOT_WRITABLE=no"
          fi
          echo "WEBROOT_TOP_LEVEL_ITEMS:"
          find "$target" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort | head -n 40 || true
          echo "WEBROOT_TOP_LEVEL_ITEMS_END"
          python3 - <<'CONTROL_AUDIT'
          """Read-only production deployment evidence inventory. Never creates files/locks.
          
          Pipe this reviewed file to pinned SSH `python3 -`; default control is the existing
          private deployment directory. Nonzero exit means do not publish.
          """
          import datetime as dt
          import fcntl
          import json
          from pathlib import Path
          import re
          import stat
          
          JST=dt.timezone(dt.timedelta(hours=9))
          def safe_json(path):
              if path.is_symlink() or not stat.S_ISREG(path.stat().st_mode):
                  raise ValueError('Unsafe state evidence: '+path.name)
              if path.stat().st_size>1_000_000:raise ValueError('Oversized state evidence')
              result=json.loads(path.read_text())
              if not isinstance(result,dict):raise ValueError('Malformed state evidence')
              return result
          
          def audit(control):
              control=Path(control)
              if not control.is_absolute():raise ValueError('Absolute control path required')
              for p in [control]+list(control.parents):
                  if p.is_symlink():raise ValueError('Symlinked control path')
              if not control.is_dir():raise ValueError('Existing control directory required')
              lock=control/'lock'
              if lock.is_symlink() or not lock.is_file():raise ValueError('Existing lock required; not creating one')
              now=dt.datetime.now(JST)
              result={'observed_at_jst':now.isoformat(),'read_only':True,'releases':[],'daily_receipts':[], 'blockers':[]}
              with lock.open('r') as stream:
                  fcntl.flock(stream,fcntl.LOCK_SH|fcntl.LOCK_NB)
                  entries=list(control.iterdir())
                  if len(entries)>10000:raise ValueError('Evidence inventory too large')
                  if (control/'pending.json').exists():
                      state=safe_json(control/'pending.json')
                      result['pending']={k:state.get(k) for k in ('release_id','source_sha','phase')}
                      result['blockers'].append('Pending transaction requires verified recovery')
                  if (control/'active.json').exists():
                      state=safe_json(control/'active.json')
                      result['active']={k:state.get(k) for k in ('release_id','source_sha','phase')}
                  for entry in entries:
                      if not re.fullmatch(r'release-[0-9]+-[0-9]+',entry.name):continue
                      if entry.is_symlink() or not entry.is_dir():raise ValueError('Unsafe release evidence')
                      state=safe_json(entry/'state.json')
                      info={k:state.get(k) for k in ('release_id','source_sha','phase')}
                      info['directory']=entry.name
                      info['directory_mtime_jst']=dt.datetime.fromtimestamp(entry.stat().st_mtime,JST).isoformat()
                      info['state_mtime_jst']=dt.datetime.fromtimestamp((entry/'state.json').stat().st_mtime,JST).isoformat()
                      result['releases'].append(info)
                  ledger=control/'daily-deploy'
                  if ledger.is_symlink():raise ValueError('Unsafe daily ledger')
                  if ledger.exists():
                      if not ledger.is_dir():raise ValueError('Malformed daily ledger')
                      days=list(ledger.iterdir())
                      if len(days)>10000:raise ValueError('Daily ledger too large')
                      for day in days:
                          if day.is_symlink() or not day.is_dir() or not re.fullmatch(r'\d{4}-\d{2}-\d{2}',day.name):
                              raise ValueError('Malformed daily entry')
                          state=safe_json(day/'attempt.json')
                          result['daily_receipts'].append({k:state.get(k) for k in ('date_jst','release_id','reserved_at','phase')})
              return result
          
          if __name__=='__main__':
              result=audit(Path.home()/'.baito-hyouban-deploy')
              print(json.dumps(result,sort_keys=True))
              raise SystemExit(1 if result['blockers'] else 0)
          CONTROL_AUDIT
          echo "NO_FILES_CHANGED=yes"
          REMOTE

