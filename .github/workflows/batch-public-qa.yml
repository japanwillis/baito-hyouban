name: Batch public responsive QA
on:
  push:
    branches: [qa/batch-public-20261105]
    paths: ['.github/workflows/batch-public-qa.yml']
permissions:
  contents: read
jobs:
  public-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated pinned browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/article-qa" --no-package-lock --no-audit --no-fund playwright@1.64.1
          node "$RUNNER_TEMP/article-qa/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Inspect all actual public articles at four widths
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/article-qa/node_modules/playwright/index.mjs
          QA_ORIGIN: https://baito-hyouban.com
        run: node scripts/all-articles-qa.mjs
      - name: Save screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-public-qa-${{ github.run_id }}
          path: responsive-qa-evidence/
          if-no-files-found: error
          retention-days: 30
