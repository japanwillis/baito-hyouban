name: Verify Astro build
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - 'astro.config.mjs'
      - 'ops/publication-approvals.json'
      - '.github/workflows/verify.yml'
      - '.github/workflows/continuous-release.yml'
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test approval gate and deployment recovery
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Confirm generated pages and image
        run: |
          test -f dist/index.html
          test -f dist/guide/first-part-time-job/index.html
          test -f dist/images/BH-0001-eyecatch.webp

# Explicit release-request-only commits are validated and rebuilt by
# continuous-release.yml. Avoid a second identical build for those requests.

