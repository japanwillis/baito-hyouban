name: Verify Astro build
on:
  push:
    branches: [main]
    # Request-only commits are tested/built by Continuous release itself.
    paths-ignore: ['ops/release-request.json']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test approval gate and deployment recovery
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Confirm generated pages and image
        run: |
          test -f dist/index.html
          test -f dist/guide/first-part-time-job/index.html
          test -f dist/images/BH-0001-eyecatch.webp

