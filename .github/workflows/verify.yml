name: Verify Astro build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test approval gate and deployment recovery
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Confirm generated pages and image
        run: |
          test -f dist/index.html
          test -f dist/guide/first-part-time-job/index.html
          test -f dist/images/BH-0001-eyecatch.webp

      - name: Diagnostic - verify existing first article differs only by AdSense head tag
        run: |
          python3 - <<'PY'
          import urllib.request
          from pathlib import Path
          old = urllib.request.urlopen('https://baito-hyouban.com/guide/first-part-time-job/',timeout=20).read()
          new = Path('dist/guide/first-part-time-job/index.html').read_bytes()
          tag = b'adsbygoogle.js'
          p = new.find(tag)
          print('AdSense tag offset:',p)
          print('New tag context:',repr(new[max(0,p-90):p+190]))
          a,b = old.find(b'<head>'),new.find(b'<head>')
          print('Old HEAD context:',repr(old[a:a+240]))
          print('New HEAD context:',repr(new[b:b+360]))
          print('Content lengths old/new:',len(old),len(new))
          PY
