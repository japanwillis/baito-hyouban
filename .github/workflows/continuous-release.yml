name: Continuous release (manual plan, deploy, rollback)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'First run plan. Deploy requires the reviewed plan hash.'
        type: choice
        options: [plan, deploy, rollback]
        default: plan
        required: true
      source_sha:
        description: 'Exact 40-character main commit SHA'
        type: string
        required: true
      plan_sha256:
        description: 'Reviewed plan SHA256 (deploy only)'
        type: string
      approval:
        description: 'DEPLOY <source_sha> <plan_sha256> or ROLLBACK <backup_id>'
        type: string
      backup_id:
        description: 'Backup ID from successful/unfinished deploy (rollback only)'
        type: string
permissions:
  contents: read
concurrency:
  group: baito-hyouban-production
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check requested commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install, test and build approved release
        if: ${{ inputs.mode != 'rollback' }}
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Run manually selected operation
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_SHA: ${{ inputs.source_sha }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          RELEASE_APPROVAL: ${{ inputs.approval }}
          BACKUP_ID: ${{ inputs.backup_id }}
          XSERVER_HOST: ${{ vars.XSERVER_HOST }}
          XSERVER_USER: ${{ vars.XSERVER_USER }}
          XSERVER_PORT: ${{ vars.XSERVER_PORT }}
          XSERVER_KEY: ${{ secrets.XSERVER_SSH_PRIVATE_KEY }}
        run: python3 scripts/release-controller.py
      - name: Retain plan and release verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence/
          if-no-files-found: warn
          retention-days: 30
# No push/schedule trigger. No automatic deployment. Never invokes initial-publish-xserver.yml.
