name: Upload verified images to Google Drive
on:
  push:
    branches: [main]
    paths: ['.github/workflows/drive-image-upload.yml', 'scripts/drive-oauth-probe.py', 'scripts/drive-image-runner.py', 'scripts/drive-image-validation.py', 'scripts/drive-image-smoke.py', 'ops/drive-image-upload-request.json', 'ops/image-staging/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oauth-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google Drive API dependencies
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth pillow
      - name: Verify authorization without publishing
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: python scripts/drive-oauth-probe.py
      - name: Test WebP media upload, download and cleanup
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: python scripts/drive-image-smoke.py
      - name: Upload staged image only when explicit request exists
        if: ${{ hashFiles('ops/drive-image-upload-request.json') != '' }}
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: python scripts/drive-image-runner.py
      - name: Save verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-drive-upload-result
          path: drive-upload-evidence/
          if-no-files-found: ignore
